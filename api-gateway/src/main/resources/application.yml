server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Identity Service - Auth endpoints (public)
        - id: identity-auth
          uri: lb://identity-service
          predicates:
            - Path=/auth/**
          filters:
            - AuthenticationFilter
        # Identity Service - User endpoints
        - id: identity-users
          uri: lb://identity-service
          predicates:
            - Path=/users/**
          filters:
            - AuthenticationFilter
        # Identity Service - Admin endpoints
        - id: identity-admin
          uri: lb://identity-service
          predicates:
            - Path=/admin/**
          filters:
            - AuthenticationFilter
        # Loan Service - Loans endpoints
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/loans/**
          filters:
            - AuthenticationFilter
        # Loan Service - Dashboard
        - id: dashboard-service
          uri: lb://loan-service
          predicates:
            - Path=/dashboard/**
          filters:
            - AuthenticationFilter
        # Loan Service - Wallet
        - id: wallet-service
          uri: lb://loan-service
          predicates:
            - Path=/wallet/**
          filters:
            - AuthenticationFilter
        # EMI Service
        - id: emi-service
          uri: lb://emi-service
          predicates:
            - Path=/emi/**
          filters:
            - AuthenticationFilter
        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - AuthenticationFilter
        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - AuthenticationFilter
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true
