server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/auth/**
          # No Auth Filter for Identity Service (Login/Register is public)
          
        - id: loan-service
          uri: lb://LOAN-SERVICE
          predicates:
            - Path=/loans/**
          filters:
            - AuthenticationFilter
            
        - id: emi-service
          uri: lb://EMI-SERVICE
          predicates:
            - Path=/emi/**
          filters:
            - AuthenticationFilter

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
