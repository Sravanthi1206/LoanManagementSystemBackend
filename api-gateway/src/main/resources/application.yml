server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**, /api/users/**, /auth/**, /users/**
          filters:
            - StripPrefix=1
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/loans/**, /api/documents/**, /api/wallet/**, /loans/**, /documents/**, /wallet/**, /dashboard/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/(?<segment>.*)
                replacement: /${segment}
        - id: emi-service
          uri: lb://emi-service
          predicates:
            - Path=/api/emi/**, /emi/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/(?<segment>.*)
                replacement: /${segment}
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**, /payments/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/(?<segment>.*)
                replacement: /${segment}
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /notifications/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/(?<segment>.*)
                replacement: /${segment}
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true
