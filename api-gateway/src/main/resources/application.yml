server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      # Fallback routes when Config Server is not available
      routes:
        - id: identity-auth
          uri: lb://identity-service
          predicates:
            - Path=/auth/**
        - id: identity-users
          uri: lb://identity-service
          predicates:
            - Path=/users/**
          filters:
            - AuthenticationFilter
        - id: identity-admin
          uri: lb://identity-service
          predicates:
            - Path=/admin/**
          filters:
            - AuthenticationFilter
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/loans/**
          filters:
            - AuthenticationFilter
        - id: dashboard-service
          uri: lb://loan-service
          predicates:
            - Path=/dashboard/**
          filters:
            - AuthenticationFilter
        - id: wallet-service
          uri: lb://loan-service
          predicates:
            - Path=/wallet/**
          filters:
            - AuthenticationFilter
        - id: emi-service
          uri: lb://emi-service
          predicates:
            - Path=/emi/**
          filters:
            - AuthenticationFilter
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - AuthenticationFilter
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - AuthenticationFilter
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# JWT Secret - provide via environment variable for production
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
