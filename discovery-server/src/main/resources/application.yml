server:
  port: 8761

spring:
  application:
    name: discovery-server

# Eureka server configuration (all embedded, no config-server dependency)
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 5000

# Enable health endpoint for Docker health check
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
