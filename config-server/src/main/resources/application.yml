server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Sravanthi1206/LoanManagementSystemConfigServer
          default-label: main

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      server:
        native:
          search-locations: file:/config-repo
        git:
          uri: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info
