server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Sravanthi1206/LoanManagementSystemConfigServer
          default-label: main

# Eureka client config (registers AFTER startup, doesn't block)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    # Don't fail if Eureka isn't up yet
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      server:
        native:
          search-locations: file:/config-repo
        git:
          uri: ""

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka
